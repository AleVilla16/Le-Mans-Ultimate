async function push(){if(!sb||!usr)return;pushT=null;try{const r=await sb.from('app_state').upsert({user_id:usr.id,data:D,updated_at:new Date().toISOString()}).select('updated_at');if(r.error)throw r.error;if(r.data&&r.data[0])lastRemote=r.data[0].updated_at;syncMsg='Sincronizzato alle '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}catch(e){syncMsg='Errore di sincronizzazione: '+(e.message||e)}updSync()}

function lst(){const q=(sf.q||'').trim().toLowerCase();const l=D.setups.map((s,i)=>({s,i})).filter(({s})=>(!sf.cl||s.cl==sf.cl)&&(!sf.car||s.car==sf.car)&&(!sf.track||s.track==sf.track)&&(!q||[s.name,s.car,s.track,s.cl].join(' ').toLowerCase().includes(q)));return `<div class="card" style="margin-top:10px">${l.length?l.map(({s,i})=>`<div class="item" onclick="sopen=${i};cmp=-1;sed=false;setupDet()"><span><b>${esc(s.name)}</b><br><span style="color:var(--mut);font:14px Arial,sans-serif;text-transform:none;letter-spacing:0">${esc(s.car)} · ${esc(s.track)}</span></span><span style="color:var(--mut)">›</span></div>`).join(''):'<p style="color:var(--mut)">'+(D.setups.length?'Nessun setup trovato.':'Nessun setup. Aggiungine uno.')+'</p>'}</div>`}
function addMany(fs){const arr=[...fs];let n=0,dup=0;const next=i=>{if(i>=arr.length){save();setup();$('#mod').innerHTML=`<div class="mo" onclick="if(event.target===this)cm()"><div class="mb" style="max-width:420px"><button class="s mx" onclick="cm()">✕</button><h3 style="margin-top:0">Setup creati</h3><p style="margin:0">${n} setup creati dai file selezionati.${dup?'<br>'+dup+' avevano un nome già presente: ho aggiunto un numero al nome.':''}</p></div></div>`;return}const f=arr[i];readSvm(f,r=>{const m=inferMeta(r.txt,f.name);let name=m.name||('Setup '+(D.setups.length+1)),b0=name,k=2;while(D.setups.some(x=>x.name==name)){name=b0+' ('+(k++)+')';}if(name!==b0)dup++;let cl=m.cl,car=m.car;if(!cl){cl=$('#n_cl').value;car=car||$('#n_car').value}if(!car)car=(CARS[cl]||[])[0]||'';D.setups.push({name,cl,car,track:m.track||$('#n_track').value,file:r.dataUrl,fname:f.name,v:r.v,raw:r.raw,all:r.all});n++;next(i+1)})};next(0)}
function addSetup(){const mf=$('#n_file').files;if(mf&&mf.length>1)return addMany(mf);const name=$('#n_name').value.trim();if(!name)return alert('Inserisci un nome');if(D.setups.some(x=>x.name==name))return alert('Esiste già un setup con questo nome');
const o={name,cl:$('#n_cl').value,car:$('#n_car').value,track:$('#n_track').value,file:null,fname:'',v:{},raw:[]};
const f=$('#n_file').files[0],done=()=>{D.setups.push(o);save();setup()};
if(f)readSvm(f,r=>{o.v=r.v;o.raw=r.raw;o.all=r.all;o.file=r.dataUrl;o.fname=f.name;done()});else done()}
function sv2(k,v){D.setups[sopen].v[k]=v;save()}
function sm(k,v){const s=D.setups[sopen];v=v.trim();if(k=='name'){if(!v||v==s.name)return setupDet();if(D.setups.some(x=>x!==s&&x.name==v)){alert('Esiste già un setup con questo nome');return setupDet()}const o=s.name;s.name=v;re(D.dd||{},key=>{const p=key.split('|');if(p[3]==o)p[3]=v;return p.join('|')});if(D.strat.setup==o)D.strat.setup=v}else{s[k]=v;if(k=='cl')s.car=(CARS[v]||[])[0]||''}save();setupDet()}
function reSvm(f){if(!f)return;if(!confirm('Sostituire le voci con quelle del nuovo file?'))return;readSvm(f,r=>{const s=D.setups[sopen],m=inferMeta(r.txt,f.name);if(m.cl)s.cl=m.cl;if(m.car)s.car=m.car;if(m.track)s.track=m.track;if(!(CARS[s.cl]||[]).includes(s.car))s.car=(CARS[s.cl]||[])[0]||'';s.v=r.v;s.raw=r.raw;s.all=r.all;s.file=r.dataUrl;s.fname=f.name;save();setupDet()})}
function setupDet(){const s=D.setups[sopen],o=cmp>=0?D.setups[cmp]:null;s.v=s.v||{};

const A=x=>{const m={};((x&&x.all)||[]).forEach(a=>{m[a.s+'|'+a.k]=a});return m},am=A(s),bm=A(o),keys=[...new Set([...(s.all||[]).map(a=>a.s+'|'+a.k),...(o?(o.all||[]).map(a=>a.s+'|'+a.k):[])])],fv=a=>a?(a.c?(a.r?a.r+' ('+a.c+')':a.c):a.r):'';

const meta=sed?`<div class="grid"><label>Nome<input value="${esc(s.name)}" onchange="sm('name',this.value)"></label><label>Categoria<select onchange="sm('cl',this.value)">${opt(CLASSES,s.cl)}</select></label><label>Auto<select onchange="sm('car',this.value)">${opt(CARS[s.cl]||[],s.car)}</select></label><label>Pista<select onchange="sm('track',this.value)">${opt(TRACKS,s.track)}</select></label><label>Sostituisci file<input type="file" onchange="reSvm(this.files[0])"></label></div>`:`<p style="color:var(--mut);margin-top:0">${esc(s.cl)} · ${esc(s.car)} · ${esc(s.track)}</p>`;
const legacy=Object.keys(s.par||{}).length?`<div class="card"><h3 style="margin-top:0">Altre voci</h3><table style="min-width:0">${Object.entries(s.par).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div>`:'';
const rawC=(s.raw&&s.raw.length&&!(s.all&&s.all.length))?`<div class="card"><h3 style="margin-top:0">Altre voci del file (non assegnate)</h3><pre style="margin:0;white-space:pre-wrap;color:var(--mut);font-size:12px">${esc(s.raw.join('\n'))}</pre></div>`:'';
const few=s.file&&Object.keys(s.v).length<6?`<p style="color:var(--ac)">Dal file sono state riconosciute poche voci: completale con Modifica.</p>`:'';
$('#mod').innerHTML=`<div class="mo" onclick="if(event.target===this)xs()"><div class="mb" style="max-width:900px"><button class="s mx" onclick="xs()">✕</button><h2 style="margin:0 50px 10px 0;font-size:clamp(28px,6vw,48px);text-align:left">${esc(s.name)}</h2>${meta}${few}

<label>Confronta con<select onchange="cmp=this.value===''?-1:+this.value;setupDet()"><option value="">—</option>${D.setups.map((x,i)=>i==sopen?'':`<option value="${i}" ${i==cmp?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
<button class="s" onclick="if(confirm('Eliminare questo setup?')){D.setups.splice(sopen,1);sopen=-1;cmp=-1;sed=false;save();cm();setup()}">Elimina</button></div>
${o?`<p><b>${nd}</b> differenze rispetto a ${esc(o.name)}</p>`:''}${body}${allC}${legacy}${rawC}</div></div>`}

function sB(k,f,v){D.base[k][f]=v;save()}
function sLap(k,v){D.laps[k+'|'+tp]=v;save()}
function dB(k){if(confirm('Rimuovere questa combinazione?')){delete D.base[k];save();tempi()}}
function addB(){D.base=D.base||{};const k=$('#t_track').value+'|'+$('#t_car').value;if(!D.base[k])D.base[k]={};save();tempi()}
function addT(){const g=k=>$('#t_'+k).value;D.times.push({track:g('track'),car:g('car'),drv:g('drv'),lap:g('lap'),fuel:g('fuel'),nrg:g('nrg'),tyre:g('tyre')});save();tempi()}

/* TEAM */
let allR=false;
function team(){const T=D.team,rs=[...T.races].reverse();
$('#app').innerHTML=`<div style="text-align:center;margin-bottom:12px">${T.logo?`<img src="${T.logo}" style="max-height:110px;max-width:80%" alt="">`:'<div class="logo" style="width:140px;height:90px;margin:auto;font-size:76px">LM</div>'}<h2 style="margin:10px 0 0">${esc(T.name)}</h2></div>
<div class="card"><h3 style="margin-top:0">Piloti</h3>${T.drivers.map((d,i)=>`<div class="pr"><label class="av" title="Cambia foto">${av(d)}<input type="file" accept="image/*" hidden onchange="dphoto(${i},this.files[0])"></label><b>${esc(d)}</b><button class="s" onclick="D.team.drivers.splice(${i},1);save();team()">Rimuovi</button></div>`).join('')}
<div class="row" style="margin-top:8px"><input id="nd" placeholder="Nuovo pilota"><label style="min-width:200px">Foto pilota<input id="ndp" type="file" accept="image/*"></label><button onclick="addD()">Aggiungi</button></div></div>
<div class="card"><h3 style="margin-top:0">Statistiche</h3><div class="kpi">${Object.entries(T.stats).map(([k,v])=>`<div><b><input type="number" value="${v}" style="font-size:18px;font-weight:700" onchange="D.team.stats['${k}']=this.value;save()"></b><span>${k}</span></div>`).join('')}</div></div>
<div class="card"><h3 style="margin-top:0">${allR?'Tutti i risultati':'Ultima gara'}</h3>
${(allR?rs:rs.slice(0,1)).map(r=>`<div class="item" style="cursor:default"><span><b>${esc(r.name)}</b><br><span style="color:var(--mut)">${esc(r.date)}</span></span><b>${esc(r.pos)}</b></div>`).join('')||'<p style="color:var(--mut)">Nessuna gara registrata</p>'}
${rs.length>1?`<button class="s" style="margin-top:8px" onclick="allR=!allR;team()">${allR?'Mostra solo ultima':'Vedi tutti i risultati'}</button>`:''}
<div class="row" style="margin-top:10px"><input id="rn" placeholder="Gara (es. 6h Spa)"><input id="rd" type="date"><input id="rp" placeholder="Posizione (es. P2)"><button onclick="addR()">+ Gara</button></div></div>
<h3>Sponsor</h3><div class="sp">${T.sponsors.map((s,i)=>`<div>${esc(s)}<br><a style="cursor:pointer;font-weight:400;color:var(--mut)" onclick="D.team.sponsors.splice(${i},1);save();team()">rimuovi</a></div>`).join('')||'<span style="color:var(--mut)">Nessuno sponsor</span>'}</div>
<div class="row" style="margin-top:10px"><input id="ns" placeholder="Nuovo sponsor"><button onclick="if($('#ns').value){D.team.sponsors.push($('#ns').value);save();team()}">Aggiungi</button></div>`}
function av(n){const p=(D.team.photos||{})[n];return p?`<img class="avi" src="${p}" alt="">`:`<span class="avi">${esc((n||'?')[0].toUpperCase())}</span>`}
function dphoto(i,f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=160,m=Math.min(im.width,im.height);c.width=c.height=s;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);D.team.photos=D.team.photos||{};D.team.photos[D.team.drivers[i]]=c.toDataURL('image/jpeg',.8);save();team()};im.src=r.result};r.readAsDataURL(f)}
function addD(){const n=$('#nd').value.trim(),f=$('#ndp').files[0];if(!n)return;if(!f)return alert('Carica una foto del pilota');D.team.drivers.push(n);dphoto(D.team.drivers.length-1,f)}
function addR(){if(!$('#rn').value)return;D.team.races.push({name:$('#rn').value,date:$('#rd').value,pos:$('#rp').value});save();team()}

/* IMPOSTAZIONI */
function sett(){sett0();$('#app').insertAdjacentHTML('beforeend',acF()+dataF()+pwF()+mgF()+ptF()+cfF()+sunF()+catF()+logoF('car','Loghi auto')+logoF('class','Loghi categorie')+logoF('track','Loghi piste'))}
function sett0(){$('#app').innerHTML=`<h2>Impostazioni</h2><div class="card"><div class="grid">
<label>Nome team<input value="${esc(D.team.name)}" onchange="D.team.name=this.value;save()"></label>
<label>Logo (immagine)<input type="file" accept="image/*" onchange="logo(this.files[0])"></label>
<label>Moltiplicatore tempo in Game (x)<input type="number" value="${D.mult}" min="1" onchange="D.mult=+this.value||1;save()"></label>
<label>Tema<select onchange="document.documentElement.dataset.theme=this.value"><option value="">Auto</option><option>dark</option><option>light</option></select></label></div>
<br><button class="s" onclick="if(confirm('Cancellare tutti i dati?')){try{localStorage.removeItem('lmu')}catch(e){}location.reload()}">Azzera dati</button></div>`}
function cfg(){D.cfg=D.cfg||{};D.cfg.tank=D.cfg.tank||{};D.cfg.res=D.cfg.res||{};D.cfg.logo=D.cfg.logo||{};D.cfg.pt=D.cfg.pt||{fuel:41,tyre:3,body:0};D.cfg.sun=D.cfg.sun||{lat:44.8015,lng:10.3279,rise:'',set:'',grise:'',gset:'',date:''};if(D.cfg.coef===undefined)D.cfg.coef=0;if(D.cfg.cl===undefined)D.cfg.cl=0;if(D.cfg.cr===undefined)D.cfg.cr=0;return D.cfg}
function lg(t,n){const p=cfg().logo[t+':'+n];return p?`<img class="lgs" src="${p}" alt="">`:''}
function lg2(t,n){const p=cfg().logo[t+':'+n];return p?`<img class="lgs" src="${p}" alt="${esc(n)}">`:`<span class="chip">${esc(n)}</span>`}
function lgoL(t){return t=='car'?Object.values(CARS).flat():t=='class'?CLASSES:TRACKS}
function catF(){const c=cfg();return `<div class="card"><h3 style="margin-top:0">Categorie auto</h3>${CLASSES.map(k=>`<div class="pr"><b>${k}</b><label>Serbatoio (L)<input type="number" min="0" step="any" value="${c.tank[k]??''}" onchange="cs('tank','${k}',this.value)"></label><label>Usa<select onchange="cs('res','${k}',this.value)">${opt(['NRG','Carburante'],c.res[k]||'Carburante')}</select></label></div>`).join('')}</div>`}
function cs(a,k,v){cfg()[a][k]=a=='tank'?(+v||0):v;save()}
function logoF(t,title){const c=cfg();return `<div class="card"><h3 style="margin-top:0">${title}</h3><div class="lg">${lgoL(t).map((n,i)=>{const p=c.logo[t+':'+n];return `<label class="lgi">${p?`<img src="${p}" alt="">`:'<span class="avi">+</span>'}<span>${esc(n)}</span><input type="file" accept="image/*" hidden onchange="lgo('${t}',${i},this.files[0])"></label>`}).join('')}</div></div>`}
function lgo(t,i,f){if(!f)return;const n=lgoL(t)[i],r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cfg().logo[t+':'+n]=c.toDataURL('image/png');save();sett()};im.onerror=()=>alert('Immagine non valida');im.src=r.result};r.readAsDataURL(f)}
function saveL(){sortLists();D.lists={tracks:TRACKS,classes:CLASSES,cars:CARS};save()}
function gL(kind,ci){return kind=='track'?TRACKS:kind=='class'?CLASSES:kind=='car'?CARS[CLASSES[ci]]:D.team.drivers}
function re(obj,f){Object.keys(obj).forEach(k=>{const n=f(k);if(n!==k){obj[n]=obj[k];delete obj[k]}})}
function mig(kind,o,v){const c=cfg(),S=D.strat,B=D.base||{},LP=D.laps||{};const ri=i=>re(D.dd||{},k=>{const p=k.split('|');if(p[i]==o)p[i]=v;return p.join('|')});if(kind=='drv')ri(0);if(kind=='track')ri(1);if(kind=='car')ri(2);
if(kind=='track'){re(D.pit||{},k=>k==o?v:k);re(D.cat||{},k=>k.endsWith('|'+o)?k.slice(0,-o.length)+v:k);re(c.logo,k=>k=='track:'+o?'track:'+v:k);const f=k=>k.startsWith(o+'|')?v+k.slice(o.length):k;re(B,f);re(LP,f);D.setups.forEach(s=>{if(s.track==o)s.track=v});if(S.track==o)S.track=v}
if(kind=='car'){re(c.logo,k=>k=='car:'+o?'car:'+v:k);const f=k=>{const p=k.split('|');if(p[1]==o)p[1]=v;return p.join('|')};re(B,f);re(LP,f);D.setups.forEach(s=>{if(s.car==o)s.car=v});if(S.car==o)S.car=v}
if(kind=='class'){re(c.logo,k=>k=='class:'+o?'class:'+v:k);re(D.cat||{},k=>k.startsWith(o+'|')?v+k.slice(o.length):k);CARS[v]=CARS[o];delete CARS[o];re(c.tank,k=>k==o?v:k);re(c.res,k=>k==o?v:k);D.setups.forEach(s=>{if(s.cl==o)s.cl=v});if(S.cl==o)S.cl=v}
if(kind=='drv'){const T=D.team;if(T.photos)re(T.photos,k=>k==o?v:k);if(S.part){re(S.part,k=>k==o?v:k);Object.values(S.part).forEach(q=>{if(q.ing==o)q.ing=v})}re(LP,k=>k.endsWith('|'+o)?k.slice(0,-o.length)+v:k);Object.values(S.rows||{}).forEach(r=>{['drv','eng','rest'].forEach(x=>{if(r[x]==o)r[x]=v})});if(tp==o)tp=v}}
function lrn(kind,ci,i,v){v=v.trim();const L=gL(kind,ci),o=L[i];if(!v||v===o)return sett();if(L.includes(v)){alert('Esiste già');return sett()}L[i]=v;mig(kind,o,v);saveL();sett()}
function ladd(kind,ci){const v=$('#ln_'+kind+'_'+ci).value.trim();if(!v)return;const L=gL(kind,ci);if(L.includes(v))return alert('Esiste già');if(kind=='class')CARS[v]=[];L.push(v);saveL();sett()}
function ldel(kind,ci,i){const L=gL(kind,ci),o=L[i];if(kind=='class'&&CLASSES.length<2)return alert('Serve almeno una categoria');if(!confirm('Rimuovere "'+o+'"?'))return;L.splice(i,1);if(kind=='class')delete CARS[o];const c=cfg(),B=D.base||{},LP=D.laps||{};
if(kind=='track'){delete c.logo['track:'+o];[B,LP].forEach(O=>Object.keys(O).forEach(k=>{if(k.startsWith(o+'|'))delete O[k]}))}
if(kind=='car'){delete c.logo['car:'+o];[B,LP].forEach(O=>Object.keys(O).forEach(k=>{if(k.split('|')[1]==o)delete O[k]}))}
if(kind=='drv'){if(D.team.photos)delete D.team.photos[o];if(D.strat.part)delete D.strat.part[o]}saveL();sett()}
function mgF(){const row=(kind,ci,items)=>items.map((n,i)=>`<div class="mr"><input value="${esc(n)}" onchange="lrn('${kind}',${ci},${i},this.value)"><button class="s" onclick="ldel('${kind}',${ci},${i})">✕</button></div>`).join('')+`<div class="mr"><input id="ln_${kind}_${ci}" placeholder="Aggiungi nuovo"><button onclick="ladd('${kind}',${ci})">+</button></div>`;
return `<div class="card"><h3 style="margin-top:0">Piste</h3>${row('track',0,TRACKS)}</div><div class="card"><h3 style="margin-top:0">Categorie</h3>${row('class',0,CLASSES)}</div><div class="card"><h3 style="margin-top:0">Auto</h3>${CLASSES.map((c,ci)=>`<h3 style="color:var(--ac)">${esc(c)}</h3>${row('car',ci,CARS[c]||[])}`).join('')}</div><div class="card"><h3 style="margin-top:0">Piloti del team</h3>${row('drv',0,D.team.drivers)}</div>`}
function logo(f){if(!f)return;const r=new FileReader();r.onload=()=>{D.team.logo=r.result;save();render()};r.readAsDataURL(f)}
function _kp(f){return function(){const y=window.scrollY||window.pageYOffset||0,r=f.apply(this,arguments);window.scrollTo(0,y);return r}}
function _km(f){return function(){const e=document.querySelector('#mod .mb'),y=e?(e.scrollTop||0):0,r=f.apply(this,arguments);const e2=document.querySelector('#mod .mb');if(e2)e2.scrollTop=y;return r}}
calc=_kp(calc);strat=_kp(strat);tempi=_kp(tempi);sett=_kp(sett);setup=_kp(setup);team=_kp(team);mdl=_km(mdl);mq=_km(mq);setupDet=_km(setupDet);
calc=(f=>function(){const r=f.apply(this,arguments);if(ENGM)engAfter();return r})(calc);
render();
initAuth();loadSun(false);
</script><script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(function(){})</script>
</body></html>
