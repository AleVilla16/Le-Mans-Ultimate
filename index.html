<style>

ty:.45;cursor:not-allowed}.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.lgi{flex-direction:column;align-items:center;text-align:center;cursor:pointer;background:var(--bg);border-radius:12px;padding:10px;gap:6px!important;font-size:13px!important;text-transform:none!important;letter-spacing:0!important;color:var(--tx)}.lgi img{height:56px;max-width:100%;object-fit:contain}.lgi .avi{border-radius:12px}.lgs{height:48px;max-width:140px;object-fit:contain}.avi{width:56px;height:56px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--bd);font:700 26px var(--hf);flex:none}.av{cursor:pointer;flex-direction:row!important}.hm{display:flex;gap:6px}.pr{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 14px;margin-bottom:8px;background:var(--bg);border-radius:12px}.pr b{flex:1;min-width:120px;font:700 22px var(--hf);letter-spacing:1px;text-transform:uppercase}.sw{flex-direction:row!important;align-items:center;gap:8px!important;cursor:pointer;font-size:14px!important}.sw input{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:12px;background:var(--bd);position:relative;padding:0;border:0;cursor:pointer;transition:.2s}.sw input::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked{background:var(--ac)}.sw input:checked::after{left:23px}
</style></head><body>
<header><div id="hl"></div><h1>Le Mans Ultimate</h1><button id="menuBtn" aria-label="Menu">☰</button>
<div id="menu"></div></header><main id="app"></main><div id="mod"></div><div id="auth"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s);

let TRACKS=['Le Mans','Spa-Francorchamps','Monza','Fuji','Bahrain','Sebring','COTA','Imola','Interlagos','Portimão','Qatar'];
let CLASSES=['Hypercar','LMP2','LMGT3'];
let CARS={Hypercar:['Ferrari 499P','Toyota GR010','Porsche 963','Cadillac V-Series.R','Peugeot 9X8','BMW M Hybrid V8','Alpine A424','Lamborghini SC63'],LMP2:['Oreca 07'],LMGT3:['Ferrari 296 GT3','Porsche 911 GT3 R','BMW M4 GT3','Corvette Z06 GT3.R','McLaren 720S GT3 Evo','Aston Martin Vantage GT3','Lexus RC F GT3','Mercedes-AMG GT3']};
const TYRES=['Soft','Medium','Hard','Wet'];
const CHG=['No','Completo','Solo Splash','Cambio gomme totale','Cambio gomme parziale'];
let D={team:{name:'Il mio Team',logo:'',drivers:['Pilota 1','Pilota 2','Pilota 3'],sponsors:[],stats:{Gare:0,Vittorie:0,Podi:0,'Giri veloci':0},races:[]},setups:[],times:[],mult:1,strat:{}};
try{const s=localStorage.getItem('lmu');if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
if(D.lists&&D.lists.tracks&&D.lists.classes&&D.lists.cars){TRACKS=D.lists.tracks;CLASSES=D.lists.classes;CARS=D.lists.cars}
const SB_URL='https://ezxufpyccnjjxlidgtra.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6eHVmcHljY25qanhsaWRndHJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTgzNTAsImV4cCI6MjEwODI3NDM1MH0.zHrQC6_I5ASGZQtc5bNGsXpQIxAgq2CLX6uu-1MqclA';
let sb=null,usr=null,pushT=null,syncMsg='',lastRemote='',hadLocal=false;
try{hadLocal=localStorage.getItem('lmu')!==null}catch(e){}
try{if(window.supabase)sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
function applyLists(){if(D.lists&&D.lists.tracks&&D.lists.classes&&D.lists.cars){TRACKS=D.lists.tracks;CLASSES=D.lists.classes;CARS=D.lists.cars}}
function updSync(){const e=$('#syncl');if(e)e.textContent=syncMsg}
function schedPush(){if(!sb||!usr)return;syncMsg='Modifiche in attesa di sincronizzazione…';updSync();clearTimeout(pushT);pushT=setTimeout(push,1200)}
async function push(){if(!sb||!usr)return;pushT=null;try{const r=await sb.from('app_state').upsert({user_id:usr.id,data:D,updated_at:new Date().toISOString()}).select('updated_at');if(r.error)throw r.error;if(r.data&&r.data[0])lastRemote=r.data[0].updated_at;syncMsg='Sincronizzato alle '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}catch(e){syncMsg='Errore di sincronizzazione: '+(e.message||e)}updSync()}
async function pull(ask){try{const r=await sb.from('app_state').select('data,updated_at').eq('user_id',usr.id).maybeSingle();if(r.error)throw r.error;const row=r.data;if(!row){await push();return false}
if(row.updated_at===lastRemote)return false;
if(ask&&hadLocal&&JSON.stringify(row.data)!==JSON.stringify(D)&&!confirm('Sul server ci sono già dati diversi da quelli di questo dispositivo.\nOK = usa i dati del server\nAnnulla = sovrascrivi il server con i dati di questo dispositivo')){await push();return false}
D=Object.assign(D,row.data);applyLists();try{localStorage.setItem('lmu',JSON.stringify(D))}catch(e){}lastRemote=row.updated_at;return true}catch(e){syncMsg='Errore di sincronizzazione: '+(e.message||e);updSync();return false}}
async function startSync(){syncMsg='Sincronizzazione…';const ch=await pull(true);hadLocal=false;if(!syncMsg.startsWith('Errore'))syncMsg='Sincronizzato alle '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});if(ch)render();else updSync()}
function authUI(msg){$('#auth').innerHTML=`<div class="mo" style="z-index:100;background:#000e"><div class="mb" style="max-width:420px"><h3 style="margin-top:0">Accedi</h3><p style="color:var(--mut)">Accedi per avere gli stessi dati su telefono e computer.</p><div class="grid" style="grid-template-columns:1fr"><label>Email<input id="a_e" type="email" autocomplete="email"></label><label>Password<input id="a_p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doAuth('in')"></label></div><p id="a_m" style="color:var(--ac)">${msg||''}</p><div class="row"><button onclick="doAuth('in')">Accedi</button><button class="s" onclick="doAuth('up')">Registrati</button></div><button class="s" onclick="$('#auth').innerHTML=''">Continua senza accedere</button></div></div>`}
function amsg(t){const m=$('#a_m');if(m)m.textContent=t}
async function doAuth(m){const e=$('#a_e').value.trim(),p=$('#a_p').value;if(!e||!p)return amsg('Inserisci email e password');amsg('Attendere…');try{let r;if(m=='up'){r=await sb.auth.signUp({email:e,password:p});if(r.error)throw r.error;if(!r.data.session)return amsg('Registrazione fatta. Conferma l\'indirizzo dal link che ti arriva via email, poi premi Accedi.')}else{r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error}usr=r.data.user;$('#auth').innerHTML='';await startSync()}catch(er){amsg(er.message||String(er))}}
async function doOut(){try{await sb.auth.signOut()}catch(e){}usr=null;syncMsg='';authUI()}
async function initAuth(){if(!sb)return;try{const r=await sb.auth.getSession();if(r.data&&r.data.session){usr=r.data.session.user;await startSync()}else authUI()}catch(e){authUI('Connessione non riuscita: i dati restano su questo dispositivo.')}}
function acF(){if(!sb)return '';return `<div class="card"><h3 style="margin-top:0">Account e sincronizzazione</h3>${usr?`<p style="margin:0 0 8px">${esc(usr.email)}</p><p id="syncl" style="color:var(--mut);margin:0 0 10px">${esc(syncMsg)}</p><div class="row"><button onclick="push()">Sincronizza ora</button><button class="s" onclick="doOut()">Esci</button></div>`:`<p style="margin-top:0;color:var(--mut)">Non hai effettuato l'accesso: i dati restano solo su questo dispositivo.</p><button onclick="authUI()">Accedi</button>`}</div>`}
if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(!document.hidden&&usr&&!pushT)pull(false).then(ch=>{if(ch)render()})});
function save(){try{localStorage.setItem('lmu',JSON.stringify(D))}catch(e){alert('Spazio pieno: file troppo grande per essere salvato.')}schedPush()}
const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/3600)}h ${String(Math.floor(s%3600/60)).padStart(2,'0')}m`};
const hm=d=>d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
let page=0;
function nav(i){page=i;$('#menu').classList.remove('open');$('#menuBtn').textContent='☰';render()}
$('#menuBtn').onclick=e=>{const o=$('#menu').classList.toggle('open');e.target.textContent=o?'✕':'☰'};

$('#menu').innerHTML=PAGES.map((p,i)=>`<a class="${i==page?'on':''}" onclick="nav(${i})">${p}</a>`).join('')}
function render(){head();[strat,setup,tempi,team,sett][page]();window.scrollTo(0,0)}

/* STRATEGIA */
function strat(){const S=D.strat;const cl=CARS[S.cl]?S.cl:CLASSES[0];
const f=(k,l,t='number',d='')=>`<label>${l}<input id="s_${k}" type="${t}" step="any" value="${S[k]??d}" onchange="sv('${k}')"></label>`;
$('#app').innerHTML=`<h2>Strategia di gara</h2><button id="datB" onclick="tgD()">${datOpen?'Dati ▴':'Dati ▾'}</button><div id="dat" class="${datOpen?'':'hide'}" style="margin-top:12px"><div class="card"><div class="grid">
<label>Pista<select id="s_track" onchange="sv('track')">${opt(TRACKS,S.track)}</select></label>
<label>Categoria<select id="s_cl" onchange="sv('cl');strat()">${opt(CLASSES,cl)}</select></label>
<label>Auto<select id="s_car" onchange="sv('car')">${opt(CARS[cl],S.car)}</select></label>
<label>Setup<select id="s_setup" onchange="sv('setup')"><option value="">—</option>${opt(D.setups.map(x=>x.name),S.setup)}</select></label>
${dF()}${tF('start','Inizio gara reale','15:00')}${tF('gstart','Inizio gara in Game','12:00')}


<label>Velocità tempo in game (x)<input type="number" min="0.1" step="any" value="${D.mult}" onchange="D.mult=+this.value||1;save();calc()"></label>

</div></div>${tyF()}${partF()}${qF()}</div><div id="res"></div>`;calc()}
function dF(){const m=parseFloat(D.strat.dur),v=Math.min(1440,isNaN(m)?360:m),h=Math.floor(v/60),mi=v%60,p=n=>String(n).padStart(2,'0'),rg=(n,s)=>Array.from({length:n},(_,i)=>`<option value="${i}" ${i==s?'selected':''}>${p(i)}</option>`).join('');return `<label>Durata gara (ore : minuti)<span class="hm"><select id="d_h" onchange="sd()">${rg(25,h)}</select><select id="d_m" onchange="sd()">${rg(60,mi)}</select></span></label>`}
function sd(){const h=+$('#d_h').value;let m=+$('#d_m').value;if(h==24){m=0;$('#d_m').value=0}D.strat.dur=h*60+m;save();calc()}
function tF(k,l,d){return `<label>${l}<input id="${k}_t" type="time" value="${D.strat[k]||d}" onchange="st2('${k}')"></label>`}
function st2(k){const v=$('#'+k+'_t').value;if(!v)return;D.strat[k]=v;save();calc()}
function tyF(){return `<div class="card"><label style="max-width:260px">Gomme disponibili<input type="number" min="0" value="${D.strat.tn??0}" onchange="tq(this.value)"></label></div>`}
function tq(v){D.strat.tn=Math.max(0,+v||0);save();calc()}
function pt(n){return (D.strat.part||{})[n]||{drive:true,eng:false}}
function partF(){return `<div class="card"><h3 style="margin-top:0">Partecipanti</h3>${D.team.drivers.map((n,i)=>{const p=pt(n);return `<div class="pr">${av(n)}<b>${esc(n)}</b><label class="sw"><input type="checkbox" ${p.drive?'checked':''} onchange="pp(${i},'drive',this.checked)"><span>Guida</span></label><label class="sw"><input type="checkbox" ${p.eng?'checked':''} onchange="pp(${i},'eng',this.checked)"><span>Ingegnere</span></label><label>Suo ingegnere<select style="min-width:140px" onchange="pp(${i},'ing',this.value)"><option value="">Automatico</option>${opt(D.team.drivers.filter(x=>x!==n&&pt(x).eng),p.ing)}</select></label></div>`}).join('')||'<span style="color:var(--mut)">Aggiungi i piloti dalla pagina Team</span>'}</div>`}
function pp(i,k,v){const n=D.team.drivers[i];D.strat.part=D.strat.part||{};D.strat.part[n]=Object.assign({},pt(n),{[k]:v});save();calc();if(k=='eng')strat()}
function lapF(){const v=parseFloat(D.strat.lap),s=isNaN(v)?210:v,m=Math.floor(s/60);return `<label>Giro medio (minuti : secondi)<span class="hm"><input id="l_m" type="number" min="0" max="9" value="${m}" onchange="sl()"><input id="l_s" type="number" min="0" max="59.9" step="0.1" value="${(s-m*60).toFixed(1)}" onchange="sl()"></span></label>`}
function sl(){const m=+$('#l_m').value||0,s=Math.min(59.9,+$('#l_s').value||0);D.strat.lap=Math.round((m*60+s)*10)/10;save();calc()}
let datOpen=false;
function tgD(){datOpen=!datOpen;$('#dat').classList.toggle('hide',!datOpen);$('#datB').textContent=datOpen?'Dati ▴':'Dati ▾'}
function sv(k){const e=$('#s_'+k);D.strat[k]=e.multiple?[...e.selectedOptions].map(o=>o.value):e.value;save();if(k=='track'||k=='car')strat();else if(k!='cl')calc()}
function calc(){const S=D.strat,n=(k,d)=>parseFloat(S[k])||d;
const CC=CARS[S.cl]?S.cl:CLASSES[0],bd=(D.cat||{})[CC+'|'+(S.track||TRACKS[0])]||{},dur=n('dur',360)*60,lap=n('lap',210),fuel=n('fuel',4.2),nrg=+bd.ln>0?100/bd.ln:n('nrg',2.8),cc=CARS[S.cl]?S.cl:CLASSES[0],tank=cfg().tank[cc]||90,res=cfg().res[cc]||'Carburante',lico=n('lico',6)/100,ty=n('tyre',30),pit=parseFloat((D.pit||{})[S.track||TRACKS[0]])||n('pit',45);
const laps=Math.ceil(dur/(lap+0));
const lim=res=='NRG'?Math.floor(100/nrg):Math.floor(tank/fuel),limL=res=='NRG'?Math.floor(100/(nrg*(1-lico))):Math.floor(tank/(fuel*(1-lico))),stintN=Math.max(1,+bd.ln>0?+bd.ln:Math.min(lim,ty));
const stintL=Math.max(1,+bd.ll>0?+bd.ll:Math.min(limL,ty));

const nz=x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,'');
function inferMeta(txt,fname){const base=String(fname||'').replace(/\.[^.]+$/,''),hay=nz(fname+'\n'+txt);let cl='',car='',track='';

const tr=[...TRACKS].sort((a,b)=>b.length-a.length).find(t=>hay.includes(nz(t)))||[...TRACKS].find(t=>{const k=nz(t.split(/[^A-Za-z0-9]+/)[0]);return k.length>=3&&hay.includes(k)});if(tr)track=tr;
const all=[];CLASSES.forEach(c=>(CARS[c]||[]).forEach(n=>all.push([c,n])));
let hit=all.slice().sort((a,b)=>b[1].length-a[1].length).find(x=>hay.includes(nz(x[1])));
if(!hit)hit=all.find(x=>{const z=nz(x[1].split(' ').slice(1).join(''));return z.length>=4&&!/^\d+$/.test(z)&&hay.includes(z)});
if(hit){car=hit[1];cl=hit[0]}

function parseSvm(txt,ts){const v={},raw=[],all=[];let sec='';txt.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l||l.startsWith('//')||l.startsWith(';'))return;const m=l.match(/^\[(.+)\]$/);if(m){sec=m[1];return}const j=l.indexOf('=');if(j<1)return;const key=l.slice(0,j).trim();let val=l.slice(j+1),cm='';const c=val.indexOf('//');if(c>=0){cm=val.slice(c+2).trim();val=val.slice(0,c)}val=val.trim();all.push({s:sec,k:key,r:val,c:cm});const disp=cm?(val?val+' ('+cm+')':cm):val,id=(sec+'.'+key).toUpperCase().replace(/[^A-Z0-9.]/g,'');let hit=null;for(const f of FIELDS){if(v[f]!==undefined)continue;const r=RX[f];if(r&&r[0].test(id)&&!(r[1]&&r[1].test(id))){hit=f;break}}if(hit)v[hit]=disp;else raw.push('['+sec+'] '+key+' = '+disp)});if(ts)v.dt=new Date(ts).toLocaleString('it-IT');return {v,raw,all}}
function readSvm(f,cb){const a=new FileReader();a.onload=()=>{const b=new FileReader();b.onload=()=>{const r=parseSvm(String(b.result),f.lastModified);r.dataUrl=a.result;r.txt=String(b.result);cb(r)};b.readAsText(f)};a.readAsDataURL(f)}

$('#app').innerHTML=`<h2>Tempi &amp; Consumi</h2><div class="row"><label>Pilota<select onchange="tp=this.value;tempi()"><option value="base" ${isB?'selected':''}>Dati base</option>${D.team.drivers.map(d=>`<option ${d==tp?'selected':''}>${esc(d)}</option>`).join('')}</select></label></div>
<p style="color:var(--mut);margin:0 0 10px">${isB?'Dati base: consumi validi per tutti i piloti, modificabili solo qui.':'I consumi sono dati base e sono bloccati: per modificarli seleziona "Dati base". Qui inserisci il giro medio del pilota.'}</p>
${isB?`<div class="row" style="align-items:center">${be?'<button onclick="be=false;msg=true;save();tempi()">Salva</button>':'<button class="s" onclick="be=true;msg=false;tempi()">Modifica</button>'}<span style="color:var(--mut)">${be?'Modifica in corso…':(msg?'✓ Dati salvati':'Dati bloccati: premi Modifica per cambiarli')}</span></div>`:''}${catCard(isB)}${fltF()}<div class="card tw"><table style="min-width:600px"><tr><th>Pista</th><th>Auto</th><th>${isB?'Giro medio (media piloti)':'Giro medio'}</th><th>Carb./giro (L)</th><th>NRG/giro (%)</th><th>Gomme/giro (%)</th><th></th></tr>${rows||'<tr><td colspan="7" style="color:var(--mut)">Nessun dato: aggiungi una combinazione auto e pista.</td></tr>'}</table></div>
<h3>Aggiungi auto su pista</h3><div class="card"><div class="grid"><label>Pista<select id="t_track">${opt(TRACKS)}</select></label><label>Auto<select id="t_car">${opt(Object.values(CARS).flat())}</select></label></div><br><button onclick="addB()">Aggiungi</button></div><button class="s" onclick="clrT()">Cancella tutto</button>`}
let tc='',tt='';
function catCard(isB){if(!CARS[tc])tc=CLASSES[0];if(!TRACKS.includes(tt))tt=TRACKS[0];D.cat=D.cat||{};const b=D.cat[tc+'|'+tt]||{},d=(isB&&be)?'':'disabled',nr=v=>+v>0?(100/v).toFixed(2)+' %':'—';
return `<div class="card"><h3 style="margin-top:0">Dati categoria su pista</h3><div class="grid"><label>Categoria<select onchange="tc=this.value;tempi()">${opt(CLASSES,tc)}</select></label><label>Pista<select onchange="tt=this.value;tempi()">${opt(TRACKS,tt)}</select></label></div><p style="color:var(--mut);margin:8px 0">Validi per tutte le auto della categoria su questa pista.</p><div class="grid"><label>Tempo pit lane (s)<input type="number" step="any" min="0" value="${esc(b.pit??'')}" ${d} onchange="sC('pit',this.value)"></label><label>Giri stint normale<input type="number" min="0" value="${esc(b.ln??'')}" ${d} onchange="sC('ln',this.value)"></label><label>Giri stint Lico<input type="number" min="0" value="${esc(b.ll??'')}" ${d} onchange="sC('ll',this.value)"></label></div><div class="kpi" style="margin-top:10px"><div><b id="kn">${nr(b.ln)}</b><span>NRG/giro stint normale</span></div><div><b id="kl">${nr(b.ll)}</b><span>NRG/giro stint Lico</span></div></div></div>`}
function sC(f,v){D.cat=D.cat||{};const k=tc+'|'+tt;(D.cat[k]=D.cat[k]||{})[f]=v;save();const bb=D.cat[k],nr=x=>+x>0?(100/x).toFixed(2)+' %':'—';$('#kn').textContent=nr(bb.ln);$('#kl').textContent=nr(bb.ll)}
let be=false,msg=false;
let ft='',fc='',fa='';
function fltF(){const cars=fc?(CARS[fc]||[]):Object.values(CARS).flat();return `<div class="card"><div class="grid"><label>Filtra pista<select onchange="ft=this.value;tempi()"><option value="">Tutte</option>${opt(TRACKS,ft)}</select></label><label>Filtra categoria<select onchange="fc=this.value;fa='';tempi()"><option value="">Tutte</option>${opt(CLASSES,fc)}</select></label><label>Filtra auto<select onchange="fa=this.value;tempi()"><option value="">Tutte</option>${opt(cars,fa)}</select></label></div></div>`}
function clrT(){if(!confirm('Cancellare tutti i dati di Tempi & Consumi (consumi, giri medi e dati categoria su pista)?'))return;D.base={};D.laps={};D.cat={};D.times=[];be=false;msg=false;save();tempi()}
function tempi(){if(tp!=='cons'&&!D.team.drivers.includes(tp))tp='cons';
$('#app').innerHTML=`<h2>Tempi &amp; Consumi</h2><div class="row"><label>Vista<select onchange="tp=this.value;be=false;msg=false;tempi()"><option value="cons" ${tp=='cons'?'selected':''}>Consumi</option>${D.team.drivers.map(d=>`<option ${d==tp?'selected':''}>${esc(d)}</option>`).join('')}</select></label></div><div id="tcont"></div>`;tp=='cons'?tCons():tDrv()}
function bar(){return `<div class="row" style="align-items:center">${be?'<button onclick="be=false;msg=true;save();tempi()">Salva</button>':'<button class="s" onclick="be=true;msg=false;tempi()">Modifica</button>'}<span style="color:var(--mut)">${be?'Modifica in corso…':(msg?'✓ Dati salvati':'Dati bloccati: premi Modifica per cambiarli')}</span></div>`}
function tCons(){D.cat=D.cat||{};const d=be?'':'disabled',nr=v=>+v>0?(100/v).toFixed(2)+' %':'—';
$('#tcont').innerHTML=bar()+`<p style="color:var(--mut)">Per ogni circuito e categoria: valori validi per tutte le auto della categoria su quella pista.</p>`+TRACKS.map((t,ti)=>`<div class="card"><h3 style="margin-top:0">${esc(t)}</h3><div class="grid" style="margin-bottom:10px"><label>Tempo pit lane (s) – uguale per tutte le categorie<input type="number" step="any" min="0" style="min-width:70px" value="${esc((D.pit||{})[t]??'')}" ${d} oninput="sP(${ti},this.value)"></label></div><div class="tw"><table style="min-width:540px"><tr><th>Categoria</th><th>Giri stint normale</th><th>NRG/giro normale</th><th>Giri stint Lico</th><th>NRG/giro Lico</th></tr>${CLASSES.map((c,ci)=>{const b=D.cat[c+'|'+t]||{},i=f=>`<td><input type="number" step="any" min="0" style="min-width:70px" value="${esc(b[f]??'')}" ${d} oninput="sK(${ci},${ti},'${f}',this.value,this)"></td>`;return `<tr><td>${esc(c)}</td>${i('ln')}<td class="nn">${nr(b.ln)}</td>${i('ll')}<td class="nl">${nr(b.ll)}</td></tr>`}).join('')}</table></div></div>`).join('')}
function sP(ti,v){D.pit=D.pit||{};D.pit[TRACKS[ti]]=v;save()}
function sK(ci,ti,f,v,el){const k=CLASSES[ci]+'|'+TRACKS[ti];D.cat=D.cat||{};(D.cat[k]=D.cat[k]||{})[f]=v;save();const tr=el.closest('tr'),b=D.cat[k],nr=x=>+x>0?(100/x).toFixed(2)+' %':'—';tr.querySelector('.nn').textContent=nr(b.ln);tr.querySelector('.nl').textContent=nr(b.ll)}
let dt='',dc='',da='',ds='';
function dK(){return tp+'|'+dt+'|'+da+'|'+ds}
function tDrv(){if(!TRACKS.includes(dt))dt=TRACKS[0];if(!CARS[dc])dc=CLASSES[0];const cars=CARS[dc]||[];if(!cars.includes(da))da=cars[0]||'';const sl=D.setups.filter(s=>s.cl==dc&&s.car==da&&s.track==dt).map(s=>s.name);if(ds&&!sl.includes(ds))ds='';D.dd=D.dd||{};const r=D.dd[dK()];
let h=`<div class="card"><div class="grid"><label>Pista<select onchange="dt=this.value;tempi()">${opt(TRACKS,dt)}</select></label><label>Categoria<select onchange="dc=this.value;da='';ds='';tempi()">${opt(CLASSES,dc)}</select></label><label>Auto<select onchange="da=this.value;ds='';tempi()">${opt(cars,da)}</select></label><label>Setup<select onchange="ds=this.value;tempi()"><option value="">—</option>${opt(sl,ds)}</select></label></div></div>`;
if(!r)h+=`<div class="card"><p style="margin-top:0">Nessun dato salvato per questa combinazione.</p><button onclick="dNew()">Crea nuovo dato</button></div>`;
else{const d=be?'':'disabled',W=r.w||{};h+=bar()+`<div class="card"><div class="grid"><label>Best Lap<input placeholder="3:25.4" value="${esc(r.bl||'')}" ${d} oninput="sD('bl',this.value)"></label><label>Giro medio<input placeholder="3:28.5" value="${esc(r.avg||'')}" ${d} oninput="sD('avg',this.value)"></label></div></div><div class="card tw"><h3 style="margin-top:0">Consumo gomme (%)</h3><table style="min-width:520px"><tr><th>Mescola</th><th>Ant. sinistra</th><th>Ant. destra</th><th>Post. sinistra</th><th>Post. destra</th></tr>${['Soft','Media','Hard'].map(m=>`<tr><td>${m}</td>${['fl','fr','rl','rr'].map(c=>`<td><input type="number" step="any" min="0" style="min-width:70px" value="${esc((W[m]||{})[c]??'')}" ${d} oninput="sW('${m}','${c}',this.value)"></td>`).join('')}</tr>`).join('')}</table></div><button class="s" onclick="dDel()">Elimina dato</button>`}
$('#tcont').innerHTML=h}
function dNew(){D.dd=D.dd||{};D.dd[dK()]={w:{}};be=true;msg=false;save();tempi()}
function sD(f,v){D.dd[dK()][f]=v;save()}
function sW(m,c,v){const r=D.dd[dK()];r.w=r.w||{};(r.w[m]=r.w[m]||{})[c]=v;save()}
function dDel(){if(confirm('Eliminare questo dato?')){delete D.dd[dK()];be=false;save();tempi()}}
function sB(k,f,v){D.base[k][f]=v;save()}
function sLap(k,v){D.laps[k+'|'+tp]=v;save()}
function dB(k){if(confirm('Rimuovere questa combinazione?')){delete D.base[k];save();tempi()}}
function addB(){D.base=D.base||{};const k=$('#t_track').value+'|'+$('#t_car').value;if(!D.base[k])D.base[k]={};save();tempi()}
function addT(){const g=k=>$('#t_'+k).value;D.times.push({track:g('track'),car:g('car'),drv:g('drv'),lap:g('lap'),fuel:g('fuel'),nrg:g('nrg'),tyre:g('tyre')});save();tempi()}

/* TEAM */
let allR=false;
function team(){const T=D.team,rs=[...T.races].reverse();
$('#app').innerHTML=`<div style="text-align:center;margin-bottom:12px">${T.logo?`<img src="${T.logo}" style="max-height:110px;max-width:80%" alt="">`:'<div class="logo" style="width:140px;height:90px;margin:auto;font-size:76px">LM</div>'}<h2 style="margin:10px 0 0">${esc(T.name)}</h2></div>
<div class="card"><h3 style="margin-top:0">Piloti</h3>${T.drivers.map((d,i)=>`<div class="pr"><label class="av" title="Cambia foto">${av(d)}<input type="file" accept="image/*" hidden onchange="dphoto(${i},this.files[0])"></label><b>${esc(d)}</b><button class="s" onclick="D.team.drivers.splice(${i},1);save();team()">Rimuovi</button></div>`).join('')}
<div class="row" style="margin-top:8px"><input id="nd" placeholder="Nuovo pilota"><label style="min-width:200px">Foto pilota<input id="ndp" type="file" accept="image/*"></label><button onclick="addD()">Aggiungi</button></div></div>
<div class="card"><h3 style="margin-top:0">Statistiche</h3><div class="kpi">${Object.entries(T.stats).map(([k,v])=>`<div><b><input type="number" value="${v}" style="font-size:18px;font-weight:700" onchange="D.team.stats['${k}']=this.value;save()"></b><span>${k}</span></div>`).join('')}</div></div>
<div class="card"><h3 style="margin-top:0">${allR?'Tutti i risultati':'Ultima gara'}</h3>
${(allR?rs:rs.slice(0,1)).map(r=>`<div class="item" style="cursor:default"><span><b>${esc(r.name)}</b><br><span style="color:var(--mut)">${esc(r.date)}</span></span><b>${esc(r.pos)}</b></div>`).join('')||'<p style="color:var(--mut)">Nessuna gara registrata</p>'}
${rs.length>1?`<button class="s" style="margin-top:8px" onclick="allR=!allR;team()">${allR?'Mostra solo ultima':'Vedi tutti i risultati'}</button>`:''}
<div class="row" style="margin-top:10px"><input id="rn" placeholder="Gara (es. 6h Spa)"><input id="rd" type="date"><input id="rp" placeholder="Posizione (es. P2)"><button onclick="addR()">+ Gara</button></div></div>
<h3>Sponsor</h3><div class="sp">${T.sponsors.map((s,i)=>`<div>${esc(s)}<br><a style="cursor:pointer;font-weight:400;color:var(--mut)" onclick="D.team.sponsors.splice(${i},1);save();team()">rimuovi</a></div>`).join('')||'<span style="color:var(--mut)">Nessuno sponsor</span>'}</div>
<div class="row" style="margin-top:10px"><input id="ns" placeholder="Nuovo sponsor"><button onclick="if($('#ns').value){D.team.sponsors.push($('#ns').value);save();team()}">Aggiungi</button></div>`}
function av(n){const p=(D.team.photos||{})[n];return p?`<img class="avi" src="${p}" alt="">`:`<span class="avi">${esc((n||'?')[0].toUpperCase())}</span>`}
function dphoto(i,f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=160,m=Math.min(im.width,im.height);c.width=c.height=s;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);D.team.photos=D.team.photos||{};D.team.photos[D.team.drivers[i]]=c.toDataURL('image/jpeg',.8);save();team()};im.src=r.result};r.readAsDataURL(f)}
function addD(){const n=$('#nd').value.trim(),f=$('#ndp').files[0];if(!n)return;if(!f)return alert('Carica una foto del pilota');D.team.drivers.push(n);dphoto(D.team.drivers.length-1,f)}
function addR(){if(!$('#rn').value)return;D.team.races.push({name:$('#rn').value,date:$('#rd').value,pos:$('#rp').value});save();team()}

/* IMPOSTAZIONI */
function sett(){sett0();$('#app').insertAdjacentHTML('beforeend',acF()+mgF()+ptF()+cfF()+catF()+logoF('car','Loghi auto')+logoF('class','Loghi categorie')+logoF('track','Loghi piste'))}
function sett0(){$('#app').innerHTML=`<h2>Impostazioni</h2><div class="card"><div class="grid">
<label>Nome team<input value="${esc(D.team.name)}" onchange="D.team.name=this.value;save()"></label>
<label>Logo (immagine)<input type="file" accept="image/*" onchange="logo(this.files[0])"></label>
<label>Moltiplicatore tempo in Game (x)<input type="number" value="${D.mult}" min="1" onchange="D.mult=+this.value||1;save()"></label>
<label>Tema<select onchange="document.documentElement.dataset.theme=this.value"><option value="">Auto</option><option>dark</option><option>light</option></select></label></div>
<br><button class="s" onclick="if(confirm('Cancellare tutti i dati?')){try{localStorage.removeItem('lmu')}catch(e){}location.reload()}">Azzera dati</button></div>`}
function cfg(){D.cfg=D.cfg||{};D.cfg.tank=D.cfg.tank||{};D.cfg.res=D.cfg.res||{};D.cfg.logo=D.cfg.logo||{};D.cfg.pt=D.cfg.pt||{fuel:41,tyre:3,body:0};if(D.cfg.coef===undefined)D.cfg.coef=0;if(D.cfg.cl===undefined)D.cfg.cl=0;if(D.cfg.cr===undefined)D.cfg.cr=0;return D.cfg}
function lg(t,n){const p=cfg().logo[t+':'+n];return p?`<img class="lgs" src="${p}" alt="">`:''}
function lg2(t,n){const p=cfg().logo[t+':'+n];return p?`<img class="lgs" src="${p}" alt="${esc(n)}">`:`<span class="chip">${esc(n)}</span>`}
function lgoL(t){return t=='car'?Object.values(CARS).flat():t=='class'?CLASSES:TRACKS}
function catF(){const c=cfg();return `<div class="card"><h3 style="margin-top:0">Categorie auto</h3>${CLASSES.map(k=>`<div class="pr"><b>${k}</b><label>Serbatoio (L)<input type="number" min="0" step="any" value="${c.tank[k]??''}" onchange="cs('tank','${k}',this.value)"></label><label>Usa<select onchange="cs('res','${k}',this.value)">${opt(['NRG','Carburante'],c.res[k]||'Carburante')}</select></label></div>`).join('')}</div>`}
function cs(a,k,v){cfg()[a][k]=a=='tank'?(+v||0):v;save()}
function logoF(t,title){const c=cfg();return `<div class="card"><h3 style="margin-top:0">${title}</h3><div class="lg">${lgoL(t).map((n,i)=>{const p=c.logo[t+':'+n];return `<label class="lgi">${p?`<img src="${p}" alt="">`:'<span class="avi">+</span>'}<span>${esc(n)}</span><input type="file" accept="image/*" hidden onchange="lgo('${t}',${i},this.files[0])"></label>`}).join('')}</div></div>`}
function lgo(t,i,f){if(!f)return;const n=lgoL(t)[i],r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cfg().logo[t+':'+n]=c.toDataURL('image/png');save();sett()};im.onerror=()=>alert('Immagine non valida');im.src=r.result};r.readAsDataURL(f)}
function saveL(){D.lists={tracks:TRACKS,classes:CLASSES,cars:CARS};save()}
function gL(kind,ci){return kind=='track'?TRACKS:kind=='class'?CLASSES:kind=='car'?CARS[CLASSES[ci]]:D.team.drivers}
function re(obj,f){Object.keys(obj).forEach(k=>{const n=f(k);if(n!==k){obj[n]=obj[k];delete obj[k]}})}
function mig(kind,o,v){const c=cfg(),S=D.strat,B=D.base||{},LP=D.laps||{};const ri=i=>re(D.dd||{},k=>{const p=k.split('|');if(p[i]==o)p[i]=v;return p.join('|')});if(kind=='drv')ri(0);if(kind=='track')ri(1);if(kind=='car')ri(2);
if(kind=='track'){re(D.pit||{},k=>k==o?v:k);re(D.cat||{},k=>k.endsWith('|'+o)?k.slice(0,-o.length)+v:k);re(c.logo,k=>k=='track:'+o?'track:'+v:k);const f=k=>k.startsWith(o+'|')?v+k.slice(o.length):k;re(B,f);re(LP,f);D.setups.forEach(s=>{if(s.track==o)s.track=v});if(S.track==o)S.track=v}
if(kind=='car'){re(c.logo,k=>k=='car:'+o?'car:'+v:k);const f=k=>{const p=k.split('|');if(p[1]==o)p[1]=v;return p.join('|')};re(B,f);re(LP,f);D.setups.forEach(s=>{if(s.car==o)s.car=v});if(S.car==o)S.car=v}
if(kind=='class'){re(c.logo,k=>k=='class:'+o?'class:'+v:k);re(D.cat||{},k=>k.startsWith(o+'|')?v+k.slice(o.length):k);CARS[v]=CARS[o];delete CARS[o];re(c.tank,k=>k==o?v:k);re(c.res,k=>k==o?v:k);D.setups.forEach(s=>{if(s.cl==o)s.cl=v});if(S.cl==o)S.cl=v}
if(kind=='drv'){const T=D.team;if(T.photos)re(T.photos,k=>k==o?v:k);if(S.part){re(S.part,k=>k==o?v:k);Object.values(S.part).forEach(q=>{if(q.ing==o)q.ing=v})}re(LP,k=>k.endsWith('|'+o)?k.slice(0,-o.length)+v:k);Object.values(S.rows||{}).forEach(r=>{['drv','eng','rest'].forEach(x=>{if(r[x]==o)r[x]=v})});if(tp==o)tp=v}}
function lrn(kind,ci,i,v){v=v.trim();const L=gL(kind,ci),o=L[i];if(!v||v===o)return sett();if(L.includes(v)){alert('Esiste già');return sett()}L[i]=v;mig(kind,o,v);saveL();sett()}
function ladd(kind,ci){const v=$('#ln_'+kind+'_'+ci).value.trim();if(!v)return;const L=gL(kind,ci);if(L.includes(v))return alert('Esiste già');if(kind=='class')CARS[v]=[];L.push(v);saveL();sett()}
function ldel(kind,ci,i){const L=gL(kind,ci),o=L[i];if(kind=='class'&&CLASSES.length<2)return alert('Serve almeno una categoria');if(!confirm('Rimuovere "'+o+'"?'))return;L.splice(i,1);if(kind=='class')delete CARS[o];const c=cfg(),B=D.base||{},LP=D.laps||{};
if(kind=='track'){delete c.logo['track:'+o];[B,LP].forEach(O=>Object.keys(O).forEach(k=>{if(k.startsWith(o+'|'))delete O[k]}))}
if(kind=='car'){delete c.logo['car:'+o];[B,LP].forEach(O=>Object.keys(O).forEach(k=>{if(k.split('|')[1]==o)delete O[k]}))}
if(kind=='drv'){if(D.team.photos)delete D.team.photos[o];if(D.strat.part)delete D.strat.part[o]}saveL();sett()}
function mgF(){const row=(kind,ci,items)=>items.map((n,i)=>`<div class="mr"><input value="${esc(n)}" onchange="lrn('${kind}',${ci},${i},this.value)"><button class="s" onclick="ldel('${kind}',${ci},${i})">✕</button></div>`).join('')+`<div class="mr"><input id="ln_${kind}_${ci}" placeholder="Aggiungi nuovo"><button onclick="ladd('${kind}',${ci})">+</button></div>`;
return `<div class="card"><h3 style="margin-top:0">Piste</h3>${row('track',0,TRACKS)}</div><div class="card"><h3 style="margin-top:0">Categorie</h3>${row('class',0,CLASSES)}</div><div class="card"><h3 style="margin-top:0">Auto</h3>${CLASSES.map((c,ci)=>`<h3 style="color:var(--ac)">${esc(c)}</h3>${row('car',ci,CARS[c]||[])}`).join('')}</div><div class="card"><h3 style="margin-top:0">Piloti del team</h3>${row('drv',0,D.team.drivers)}</div>`}
function logo(f){if(!f)return;const r=new FileReader();r.onload=()=>{D.team.logo=r.result;save();render()};r.readAsDataURL(f)}
render();
initAuth();
</script></body></html>
